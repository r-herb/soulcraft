<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0c2b">
  <meta name="description" content="Soulcraft - a voxel sandbox adventure you can play in your browser. Build, survive and free the souls.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soulcraft">
  <meta property="og:title" content="Soulcraft">
  <meta property="og:description" content="Build. Survive. Free the souls.">
  <meta property="og:image" content="/icons/icon-512.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/tiny5-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <title>Soulcraft</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e0c2b; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="screens"></div>
    <div id="toasts"></div>
    <div id="rotate">
      <svg class="rotate-icon" viewBox="0 0 64 64" fill="none" stroke="#7ff3ff" stroke-width="4"><rect x="18" y="6" width="28" height="52" rx="4"/><path d="M28 50h8"/></svg>
      <h2 class="panel-title" data-i18n="rotate.title">Turn your phone</h2>
      <p class="dim" data-i18n="rotate.body">Soulcraft plays in landscape. Rotate your device to continue.</p>
    </div>
  </div>
  <noscript>Soulcraft needs JavaScript.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
