name: Test and deploy

# Every push and pull request runs the Playwright tests against the
# production build (smoke, survival and accounts tests, the full boss
# progression and the Treasure Quest). Pushes to main then deploy that exact
# build, plus the accounts API (Pages Functions + D1), to Cloudflare Pages
# (project "soulcraft") on https://soulcraft.8nomads.com - only if the tests
# passed.
on:
  push:
    branches: ["main"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # (the same tests; the suite now takes a little over 30 minutes)
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Playwright smoke + survival + accounts tests (mobile landscape + desktop)
        run: npx playwright test --grep-invert "Boss progression|Treasure Quest"
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Plays all five guardian fights in order, through to the victory screen.
  bosses:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Boss progression test
        run: npx playwright test tests/bosses.spec.js --project=desktop
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: boss-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Plays the Treasure Quest from the camp to the treasure chest.
  quest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Treasure Quest playthrough
        run: npx playwright test tests/quest.spec.js --project=desktop
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quest-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Plays chapter 2 of the Treasure Quest (the Frozen Spire).
  quest2:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Treasure Quest chapter 2 playthrough
        run: npx playwright test tests/quest2.spec.js --project=desktop
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quest2-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: [test, bosses, quest, quest2]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - run: npm ci

      # Deploy exactly the build that passed the tests.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the Pages project if missing
        run: |
          if npx wrangler pages project list 2>/dev/null | grep -q '\bsoulcraft\b'; then
            echo "Pages project soulcraft exists"
          else
            npx wrangler pages project create soulcraft --production-branch main
          fi

      # Accounts: the D1 database, its schema, and the superadmin login.
      - name: D1 database for accounts (create if missing)
        run: node scripts/cloudflare-d1.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply soulcraft --remote

      - name: Superadmin login (Pages secrets from GitHub secrets)
        env:
          SUPERADMIN_LOGIN: ${{ secrets.SUPERADMIN_LOGIN }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
        run: |
          if [ -z "$SUPERADMIN_LOGIN" ] || [ -z "$SUPERADMIN_PASSWORD" ]; then
            echo "::warning::SUPERADMIN_LOGIN / SUPERADMIN_PASSWORD are not set in GitHub secrets - the admin panel will refuse every sign-in."
            exit 0
          fi
          printf '%s' "$SUPERADMIN_LOGIN" | npx wrangler pages secret put SUPERADMIN_LOGIN --project-name soulcraft
          printf '%s' "$SUPERADMIN_PASSWORD" | npx wrangler pages secret put SUPERADMIN_PASSWORD --project-name soulcraft

      - name: Email for password resets (Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY is not set in GitHub secrets - password reset by email stays off."
            exit 0
          fi
          printf '%s' "$RESEND_API_KEY" | npx wrangler pages secret put RESEND_API_KEY --project-name soulcraft
          node scripts/resend-domain.mjs

      # Multiplayer rooms: the soulcraft-mp Worker (one Durable Object per
      # room), bound to the Pages project as ROOMS. It needs the API token
      # permission "Account > Workers Scripts > Edit"; without it the game
      # simply runs without "Play with friends".
      # A redeploy restarts the Durable Objects and closes every open room,
      # so the Worker is only deployed again when mp/ changed.
      - name: Multiplayer rooms Worker (Durable Objects)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          bind() { printf '\n[[durable_objects.bindings]]\nname = "ROOMS"\nclass_name = "Room"\nscript_name = "soulcraft-mp"\n' >> wrangler.toml; }
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" HEAD -- mp/ \
             && (cd mp && npx wrangler deployments list >/dev/null 2>&1); then
            bind
            echo "Rooms Worker unchanged: not redeployed (open rooms stay open), bound to Pages as ROOMS"
          elif (cd mp && npx wrangler deploy); then
            bind
            echo "Rooms Worker deployed and bound to Pages as ROOMS"
          else
            echo "::warning::Could not deploy the multiplayer Worker. Add the API token permission Account > Workers Scripts > Edit at https://dash.cloudflare.com/profile/api-tokens - Play with friends stays off until then."
          fi

      # Runs from the repo root, so functions/ (the /api) and wrangler.toml
      # (the D1 binding) go up with the static build.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.142.0"
          command: pages deploy dist --project-name=soulcraft --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true

      - name: Custom domain soulcraft.8nomads.com (domain + proxied CNAME)
        run: node scripts/cloudflare-domain.mjs --wait

      - name: Wait for the live site to serve this build
        run: |
          set -euo pipefail
          want=$(grep -o 'assets/main-[^"]*\.js' dist/index.html | head -1)
          echo "expecting $want"
          for i in $(seq 1 40); do
            body=$(curl -sS --max-time 20 https://soulcraft.8nomads.com/ || true)
            if echo "$body" | grep -q "$want"; then echo "live site is on this build"; exit 0; fi
            echo "not yet ($i) - retrying in 15s"; sleep 15
          done
          echo "::error::https://soulcraft.8nomads.com did not serve the new build"; exit 1

      - name: Check headers
        run: |
          curl -sSI https://soulcraft.8nomads.com/ | tr -d '\r' | grep -i -E '^(http|cache-control|content-security-policy|x-content-type-options)'
          curl -sSI https://soulcraft.8nomads.com/sw.js | tr -d '\r' | grep -i -E '^(http|cache-control)'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright test against the live site
        run: npx playwright test --project=live
        env:
          CI: "1"
          LIVE_URL: https://soulcraft.8nomads.com
          SUPERADMIN_LOGIN: ${{ secrets.SUPERADMIN_LOGIN }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
