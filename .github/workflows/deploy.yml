name: Test and deploy

# Every push and pull request runs the Playwright tests against the
# production build (smoke and survival tests, plus the full boss progression). Pushes to main then deploy that exact build to Cloudflare
# Pages (project "soulcraft") on https://soulcraft.8nomads.com - only if the
# tests passed.
on:
  push:
    branches: ["main"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Playwright smoke + survival tests (mobile landscape + desktop)
        run: npx playwright test --grep-invert "Boss progression"
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Plays all five guardian fights in order, through to the victory screen.
  bosses:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Boss progression test
        run: npx playwright test tests/bosses.spec.js --project=desktop
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: boss-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: [test, bosses]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - run: npm ci

      # Deploy exactly the build that passed the tests.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the Pages project if missing
        run: |
          if npx wrangler@4.142.0 pages project list 2>/dev/null | grep -q '\bsoulcraft\b'; then
            echo "Pages project soulcraft exists"
          else
            npx wrangler@4.142.0 pages project create soulcraft --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.142.0"
          command: pages deploy dist --project-name=soulcraft --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true

      - name: Custom domain soulcraft.8nomads.com (domain + proxied CNAME)
        run: node scripts/cloudflare-domain.mjs --wait

      - name: Wait for the live site to serve this build
        run: |
          set -euo pipefail
          want=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          echo "expecting $want"
          for i in $(seq 1 40); do
            body=$(curl -sS --max-time 20 https://soulcraft.8nomads.com/ || true)
            if echo "$body" | grep -q "$want"; then echo "live site is on this build"; exit 0; fi
            echo "not yet ($i) - retrying in 15s"; sleep 15
          done
          echo "::error::https://soulcraft.8nomads.com did not serve the new build"; exit 1

      - name: Check headers
        run: |
          curl -sSI https://soulcraft.8nomads.com/ | tr -d '\r' | grep -i -E '^(http|cache-control|content-security-policy|x-content-type-options)'
          curl -sSI https://soulcraft.8nomads.com/sw.js | tr -d '\r' | grep -i -E '^(http|cache-control)'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright test against the live site
        run: npx playwright test --project=live
        env:
          CI: "1"
          LIVE_URL: https://soulcraft.8nomads.com
